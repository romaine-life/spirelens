name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: romaine-life/pipeline-templates/actions/check-fetches@main
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo code=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE...HEAD")
          if grep -qvE '\.md$|^docs/|^LICENSE$' <<< "$files"; then
            echo code=true >> "$GITHUB_OUTPUT"
          fi

  go:
    runs-on: [ubuntu-latest, upstairspc-linux]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: romaine-life/pipeline-templates/actions/setup-go@main
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: GOOS=windows GOARCH=amd64 go build ./...
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: romaine-life/pipeline-templates/actions/home-cache@main
      - uses: romaine-life/pipeline-templates/actions/setup-dotnet@main
        with:
          dotnet-version: '9.0'
      - name: Test against reference assemblies
        run: dotnet test Tests/SpireLens.Core.Tests/SpireLens.Core.Tests.csproj -c Release -p:SkipModsDeploy=true -p:Sts2DataDir=Z:/forgejo-no-game --filter "Category!=RequiresLiveGame" --logger "console;verbosity=normal"
      - name: Build mod
        run: |
          $env:GITHUB_REF_NAME = (Get-Content SpireLens.json -Raw | ConvertFrom-Json).version
          dotnet build Core/SpireLens.Core.csproj -c Release -p:SkipModsDeploy=true -p:Sts2DataDir=Z:/forgejo-no-game
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build SpireLens.csproj -c Release -p:SkipModsDeploy=true -p:Sts2DataDir=Z:/forgejo-no-game
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Sign mod assemblies
        env:
          PFX: ${{ secrets.AT_TERMINAL_PFX }}
          PFX_PASSWORD: ${{ secrets.AT_TERMINAL_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX) { throw 'AT_TERMINAL_PFX is missing' }
          $bytes = [Convert]::FromBase64String($env:PFX)
          $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $bytes, $env:PFX_PASSWORD,
            [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::UserKeySet)
          try {
            foreach ($dll in @('.godot/mono/temp/bin/Release/SpireLens.dll', 'Core/bin/Release/net9.0/SpireLens.Core.dll')) {
              $signature = Set-AuthenticodeSignature -LiteralPath $dll -Certificate $certificate -HashAlgorithm SHA256
              if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $certificate.Thumbprint) {
                throw "Signature verification failed for ${dll}: $($signature.Status)"
              }
            }
          } finally {
            $certificate.Dispose()
            [Array]::Clear($bytes, 0, $bytes.Length)
          }
      - name: Package mod
        id: version
        run: |
          $staging = New-Item -ItemType Directory -Path build_staging/SpireLens -Force
          Copy-Item .godot/mono/temp/bin/Release/SpireLens.dll, SpireLens.json, Core/bin/Release/net9.0/SpireLens.Core.dll -Destination $staging -Force
          Copy-Item .godot/mono/temp/bin/Release/Mono.Cecil*.dll -Destination $staging -Force
          Compress-Archive -Path build_staging/SpireLens -DestinationPath SpireLens.zip -Force
          $version = (Get-Content SpireLens.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'Invalid manifest version' }
          "version=$version" | Add-Content $env:GITHUB_OUTPUT
      - uses: forgejo/upload-artifact@v4
        with:
          name: SpireLens-Package
          path: SpireLens.zip
          if-no-files-found: error

  release:
    name: Release and Workshop
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [go, build]
    runs-on: windows-latest
    timeout-minutes: 25
    concurrency:
      group: steam-workshop
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.build.outputs.version }}
      STEAM_USERNAME: ${{ vars.STEAM_USERNAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: forgejo/download-artifact@v4
        with:
          name: SpireLens-Package
          path: workshop_artifact
      - name: Determine publication
        id: version
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $api = "$env:GITHUB_SERVER_URL/api/v1/repos/$env:GITHUB_REPOSITORY"
          $h = @{Authorization = "token $env:TOKEN"}
          $release = Invoke-RestMethod "$api/releases/tags/$env:VERSION" -Headers $h -SkipHttpErrorCheck -StatusCodeVariable code
          if ($code -eq 200 -and -not $release.draft -and ($release.assets | Where-Object name -eq 'SpireLens.zip')) {
            'publish=false' | Add-Content $env:GITHUB_OUTPUT
            Write-Host "$env:VERSION already published"
            exit 0
          }
          if ($code -ne 404 -and $code -ne 200) { throw "Release lookup returned $code" }
          $tag = Invoke-RestMethod "$api/tags/$env:VERSION" -Headers $h -SkipHttpErrorCheck -StatusCodeVariable tagCode
          if ($tagCode -eq 404) {
            Invoke-RestMethod "$api/tags" -Method Post -Headers $h -ContentType application/json -Body (@{tag_name=$env:VERSION; target=$env:GITHUB_SHA} | ConvertTo-Json) | Out-Null
          } elseif ($tagCode -ne 200 -or $tag.commit.sha -ne $env:GITHUB_SHA) { throw 'Release tag names a different commit' }
          git fetch origin tag $env:VERSION
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          'publish=true' | Add-Content $env:GITHUB_OUTPUT
      - name: Build shared release notes
        if: steps.version.outputs.publish == 'true'
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/build-release-notes.ps1 -Repository $env:GITHUB_REPOSITORY -CurrentTag $env:VERSION -OutputPath release-notes.md -WorkshopOutputPath workshop-notes.md
      - name: Validate tagged package
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $archive = Join-Path $PWD "workshop_artifact/SpireLens.zip"
          $contentRoot = Join-Path $PWD "workshop_content"
          Expand-Archive -LiteralPath $archive -DestinationPath $contentRoot -Force

          $modDirectory = Join-Path $contentRoot "SpireLens"
          $manifestPath = Join-Path $modDirectory "SpireLens.json"
          if (-not (Test-Path -LiteralPath $manifestPath)) {
            throw "The package does not contain SpireLens/SpireLens.json."
          }

          $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json
          if ($manifest.version -ne $env:VERSION) {
            throw "Tag '$env:VERSION' does not match manifest version '$($manifest.version)'."
          }

          $expectedFiles = @(
            "Mono.Cecil.dll",
            "Mono.Cecil.Mdb.dll",
            "Mono.Cecil.Pdb.dll",
            "Mono.Cecil.Rocks.dll",
            "SpireLens.Core.dll",
            "SpireLens.dll",
            "SpireLens.json"
          )
          $actualFiles = @(
            Get-ChildItem -LiteralPath $modDirectory -File |
              Select-Object -ExpandProperty Name |
              Sort-Object
          )
          $unexpected = @($actualFiles | Where-Object { $_ -notin $expectedFiles })
          $missing = @($expectedFiles | Where-Object { $_ -notin $actualFiles })
          if ($unexpected.Count -gt 0 -or $missing.Count -gt 0) {
            throw "Unexpected package contents. Missing: [$($missing -join ', ')]. Unexpected: [$($unexpected -join ', ')]."
          }

      - name: Install SteamCMD
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $steamDirectory = Join-Path $PWD "steamcmd"
          $steamArchive = Join-Path $PWD "steamcmd.zip"
          New-Item -ItemType Directory -Path $steamDirectory -Force | Out-Null
          Invoke-WebRequest `
            -Uri "https://artifacts.home.romaine.life/general/steam/client/installer/steamcmd.zip" -OutFile $steamArchive
          Expand-Archive -LiteralPath $steamArchive -DestinationPath $steamDirectory -Force

          # A fresh SteamCMD can replace and relaunch itself, then return exit
          # code 7 even though the update completed. Retry the installed client
          # once and require that post-update invocation to exit cleanly.
          $steamExecutable = Join-Path $steamDirectory "steamcmd.exe"
          & $steamExecutable "+quit"
          if ($LASTEXITCODE -ne 0) {
            $firstExitCode = $LASTEXITCODE
            Write-Warning "SteamCMD initial bootstrap exited with code $firstExitCode; retrying the updated client."
            & $steamExecutable "+quit"
            if ($LASTEXITCODE -ne 0) {
              throw "SteamCMD post-update bootstrap failed with exit code $LASTEXITCODE (initial exit code $firstExitCode)."
            }
          }

      - name: Restore Steam publishing credential
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          STEAM_CONFIG_VDF_B64: ${{ secrets.STEAM_CONFIG_VDF_B64 }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:STEAM_CONFIG_VDF_B64)) {
            throw "Forgejo Actions is missing STEAM_CONFIG_VDF_B64."
          }
          if ([string]::IsNullOrWhiteSpace($env:STEAM_USERNAME)) {
            throw "Forgejo Actions is missing STEAM_USERNAME."
          }

          Write-Output "::add-mask::$env:STEAM_USERNAME"
          $configDirectory = Join-Path $PWD "steamcmd/config"
          New-Item -ItemType Directory -Path $configDirectory -Force | Out-Null
          $configBytes = [Convert]::FromBase64String($env:STEAM_CONFIG_VDF_B64)
          [IO.File]::WriteAllBytes(
            (Join-Path $configDirectory "config.vdf"),
            $configBytes)

      - name: Publish Workshop item
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          Write-Output "::add-mask::$env:STEAM_USERNAME"
          $contentRoot = (Resolve-Path (Join-Path $PWD "workshop_content")).Path
          $escapedContentRoot = $contentRoot.Replace("\", "/")
          $releaseNotesPath = Join-Path $PWD "workshop-notes.md"
          if (-not (Test-Path -LiteralPath $releaseNotesPath)) {
            throw "The Workshop notes file is missing."
          }

          $changeNote = (Get-Content -Raw -LiteralPath $releaseNotesPath).Trim()
          if ([string]::IsNullOrWhiteSpace($changeNote)) {
            throw "The shared release notes artifact is empty."
          }

          # SteamCMD's KeyValues parser has escape processing disabled: \"
          # terminates a token. Preserve words and real line feeds; omit PR
          # citation suffixes and use apostrophes for quotes in Workshop text.
          # Forgejo receives the complete, unchanged Markdown changelog.
          $escapedChangeNote = [regex]::Replace($changeNote, '(?m) \(#\d+\)(?=\r?$)', '')
          $escapedChangeNote = $escapedChangeNote.Replace('"', "'").Replace("`r", "")
          if ([Text.Encoding]::UTF8.GetByteCount($escapedChangeNote) -gt 4000) {
            throw 'Workshop notes exceed the KeyValues token budget; shorten player-facing PR bullets before publishing.'
          }
          # Keep real line-feed characters inside the quoted KeyValues value.
          # Steam renders those as line breaks in the public changelog. A
          # literal "\n" is displayed verbatim and collapses the entry into
          # one paragraph.
          if ($escapedChangeNote.Contains("\n")) {
            throw "Workshop change notes contain a literal \\n sequence."
          }
          $workshopConfig = Join-Path $PWD "workshop-item.vdf"
          @"
          "workshopitem"
          {
              "appid"            "2868840"
              "publishedfileid"  "3774710835"
              "contentfolder"    "$escapedContentRoot"
              "changenote"       "$escapedChangeNote"
          }
          "@ | Set-Content -LiteralPath $workshopConfig -Encoding utf8

          $steamLog = Join-Path $PWD "steamcmd-workshop.log"
          & (Join-Path $PWD "steamcmd/steamcmd.exe") `
            "+login" $env:STEAM_USERNAME `
            "+workshop_build_item" $workshopConfig `
            "+quit" 2>&1 |
            Tee-Object -FilePath $steamLog
          $steamExitCode = $LASTEXITCODE
          $logText = Get-Content -Raw -LiteralPath $steamLog

          if ($steamExitCode -ne 0) {
            throw "SteamCMD exited with code $steamExitCode."
          }
          if ($logText -match "(?im)^\s*ERROR!|login failure|failed to update workshop item") {
            throw "SteamCMD reported a Workshop publishing failure."
          }
          if ($logText -notmatch "(?im)Committing update\.\.\.\s*Success\.") {
            throw "SteamCMD did not report a successful Workshop update."
          }

      - name: Publish Forgejo release
        if: steps.version.outputs.publish == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $api = "$env:GITHUB_SERVER_URL/api/v1/repos/$env:GITHUB_REPOSITORY/releases"
          $h = @{Authorization = "token $env:TOKEN"}
          $release = Invoke-RestMethod "$api/tags/$env:VERSION" -Headers $h -SkipHttpErrorCheck -StatusCodeVariable code
          if ($code -eq 404) {
            $release = Invoke-RestMethod $api -Method Post -Headers $h -ContentType application/json -Body (@{tag_name=$env:VERSION; target_commitish=$env:GITHUB_SHA; name=$env:VERSION; body=(Get-Content release-notes.md -Raw); draft=$true} | ConvertTo-Json)
          } elseif ($code -ne 200) { throw "Release lookup returned $code" }
          if (-not ($release.assets | Where-Object name -eq 'SpireLens.zip')) {
            Invoke-RestMethod "$api/$($release.id)/assets?name=SpireLens.zip" -Method Post -Headers $h -Form @{attachment=Get-Item workshop_artifact/SpireLens.zip} | Out-Null
          }
          Invoke-RestMethod "$api/$($release.id)" -Method Patch -Headers $h -ContentType application/json -Body '{"draft":false}' | Out-Null
      - name: Delete the files of older releases
        if: steps.version.outputs.publish == 'true'
        uses: romaine-life/pipeline-templates/actions/prune-releases@main
      - name: Remove isolated Steam credential
        if: always()
        run: |
          Remove-Item -LiteralPath steamcmd/config/config.vdf -Force -ErrorAction SilentlyContinue
